name: Deploy static content to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  # Called by Build Devices Index after it pushes with GITHUB_TOKEN.
  # Those pushes do not trigger this workflow's `on.push` (GitHub loop guard).
  workflow_call:
    inputs:
      ref:
        description: 'Git ref or SHA to build (the commit that updated devices-index.json)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_call's github.sha is the caller's starting commit, not the
          # bot commit that was just pushed. Prefer the explicit ref when set.
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
